[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "velociscuti"
version = "0.1.0"
description = "Neural-network emulator of rotating delta Scuti pulsation models, with the inference code used for the Pleiades"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Anuj Gautam"}]
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
  "torch>=2.3,<3",
  "ultranest>=4.4,<5",
  "corner>=2.2",
  "matplotlib>=3.8",
]

[project.urls]
Repository = "https://github.com/gautam-404/velociscuti-inference"

[tool.setuptools]
packages = ["velociscuti", "velociscuti.model"]

[tool.setuptools.package-data]
"velociscuti.model" = ["*"]
